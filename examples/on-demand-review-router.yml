name: SD routed review

on:
  workflow_dispatch:
    inputs:
      review-request:
        description: Canonical sd-github-review v1 request JSON
        required: true
        type: string
      operation:
        description: Route a review or query an existing exact-head receipt
        required: true
        default: route
        type: choice
        options: [route, query]
      rerequest-authorized:
        description: Authorize a validated same-head request with attempt greater than one
        required: false
        default: false
        type: boolean
      # There is deliberately no `independent-review-floor` input here. The
      # floor is the minimum automatic route, and the caller it constrains is a
      # workflow_dispatch caller -- offering it on the dispatch form hands that
      # caller its own minimum. It reads from REVIEW_INDEPENDENT_FLOOR below,
      # exactly as route-policy reads from REVIEW_ROUTE_MODE.

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Route or query the exact-head review
        id: review
        # Current release; upgrade every first-party reference together.
        uses: platypeeps/sd-github-review@6ba1eff049962faded1c289f666ef56b58c61b4d
        with:
          github-token: ${{ github.token }}
          operation: ${{ inputs.operation }}
          review-request: ${{ inputs.review-request }}
          cheap-backend: ${{ vars.SD_REVIEW_CHEAP_BACKEND_V1 }}
          deep-backend: ${{ vars.SD_REVIEW_DEEP_BACKEND_V1 }}
          rerequest-authorized: ${{ inputs.rerequest-authorized }}
          allow-bookkeeping-none: ${{ vars.SD_REVIEW_ALLOW_BOOKKEEPING_NONE || 'false' }}
          independent-review-floor: ${{ vars.REVIEW_INDEPENDENT_FLOOR }}
          # Read straight from the repository variable, NOT from a
          # workflow_dispatch input -- as with the floor above. This is the maximum
          # route a caller may explicitly request, and the caller it constrains
          # is a workflow_dispatch caller -- routing it through `inputs.` would
          # let them set their own policy and defeat it entirely. Repository
          # variables cannot be set from a dispatch form. Do not "make this
          # consistent" with its neighbours.
          route-policy: ${{ vars.REVIEW_ROUTE_MODE }}

      # This placeholder represents a consumer-owned action that accepts the
      # canonical adapter request, writes findings to its declared GitHub
      # channels, and returns one canonical v1 acknowledgment. It must not
      # check out or execute pull-request-controlled code with provider secrets.
      - name: Run the selected external reviewer
        id: adapter
        if: steps.review.outputs.adapter-request != ''
        uses: your-org/routed-review-adapter@<adapter-commit-sha>
        with:
          adapter-request: ${{ steps.review.outputs.adapter-request }}
          provider-token: ${{ secrets.REVIEW_PROVIDER_TOKEN }}

      - name: Finalize the external receipt
        if: steps.review.outputs.adapter-request != '' && always()
        uses: platypeeps/sd-github-review@6ba1eff049962faded1c289f666ef56b58c61b4d
        with:
          github-token: ${{ github.token }}
          operation: finalize
          review-request: ${{ inputs.review-request }}
          adapter-acknowledgment: ${{ steps.adapter.outputs.adapter-acknowledgment }}
