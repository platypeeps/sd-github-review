name: SD routed review with PR-Agent

on:
  workflow_dispatch:
    inputs:
      review-request:
        description: Canonical sd-github-review v1 request JSON
        required: true
        type: string
      operation:
        description: Route a review or query an existing exact-head receipt
        required: true
        default: route
        type: choice
        options: [route, query]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Route or query the exact-head review
        id: review
        # v0.1.0; upgrade every first-party reference together.
        uses: platypeeps/sd-github-review@8636a3983d18de17c49907a4c48170a61b1bb713
        with:
          github-token: ${{ github.token }}
          operation: ${{ inputs.operation }}
          review-request: ${{ inputs.review-request }}
          cheap-backend: ${{ vars.SD_REVIEW_CHEAP_BACKEND_V1 }}
          deep-backend: ${{ vars.SD_REVIEW_DEEP_BACKEND_V1 }}
          allow-bookkeeping-none: ${{ vars.SD_REVIEW_ALLOW_BOOKKEEPING_NONE || 'false' }}

      - name: Validate PR-Agent configuration
        id: pr-agent-config
        if: steps.review.outputs.adapter-request != ''
        env:
          REVIEW_BACKEND_ID: ${{ steps.review.outputs.backend-id }}
          REVIEW_MODEL_PROVIDER: ${{ vars.PR_AGENT_MODEL_PROVIDER }}
          REVIEW_MODEL: ${{ steps.review.outputs.model }}
        run: |
          if [ "$REVIEW_BACKEND_ID" != "pr-agent" ]; then
            echo "The selected external backend must use id pr-agent." >&2
            exit 1
          fi
          if [ -z "$REVIEW_MODEL" ]; then
            echo "The selected PR-Agent backend must declare a model." >&2
            exit 1
          fi
          case "$REVIEW_MODEL_PROVIDER" in
            openai)
              REVIEW_MODEL_PREFIX=""
              ;;
            gemini|openrouter|anthropic|cohere|replicate|groq|sambanova|xai|deepseek|deepinfra|mistral|codestral)
              REVIEW_MODEL_PREFIX="${REVIEW_MODEL_PROVIDER}/"
              ;;
            *)
              echo "PR_AGENT_MODEL_PROVIDER must select a supported single-key provider." >&2
              exit 1
              ;;
          esac
          if [ -n "$REVIEW_MODEL_PREFIX" ]; then
            case "$REVIEW_MODEL" in
              "$REVIEW_MODEL_PREFIX"*) ;;
              *)
                echo "The selected PR-Agent model must use the ${REVIEW_MODEL_PREFIX}<model-id> format." >&2
                exit 1
              ;;
            esac
          fi

      - name: Run PR-Agent review
        id: pr-agent
        if: steps.pr-agent-config.outcome == 'success'
        env:
          GITHUB__USER_TOKEN: ${{ github.token }}
          OPENAI__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'openai' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'gemini' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          OPENROUTER__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'openrouter' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          ANTHROPIC__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'anthropic' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          COHERE__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'cohere' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          REPLICATE__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'replicate' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          GROQ__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'groq' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          SAMBANOVA__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'sambanova' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          XAI__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'xai' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          DEEPSEEK__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'deepseek' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          DEEPINFRA__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'deepinfra' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          MISTRAL__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'mistral' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          CODESTRAL__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'codestral' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          CONFIG__MODEL: ${{ steps.review.outputs.model }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__RESTRICTED_MODE: "true"
          REVIEW_PULL_REQUEST_NUMBER: ${{ steps.review.outputs.pull-request-number }}
        run: |
          docker run --rm \
            --env GITHUB__USER_TOKEN \
            --env OPENAI__KEY \
            --env GOOGLE_AI_STUDIO__GEMINI_API_KEY \
            --env OPENROUTER__KEY \
            --env ANTHROPIC__KEY \
            --env COHERE__KEY \
            --env REPLICATE__KEY \
            --env GROQ__KEY \
            --env SAMBANOVA__KEY \
            --env XAI__KEY \
            --env DEEPSEEK__KEY \
            --env DEEPINFRA__KEY \
            --env MISTRAL__KEY \
            --env CODESTRAL__KEY \
            --env CONFIG__MODEL \
            --env CONFIG__FALLBACK_MODELS \
            --env CONFIG__RESTRICTED_MODE \
            pragent/pr-agent@sha256:cae31b51b65b5c978a3b2a978d96e89e6a4c5bcd81cb2553fd8dad0251c3a23e \
            --pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${REVIEW_PULL_REQUEST_NUMBER}" \
            review

      - name: Build the PR-Agent acknowledgment
        id: acknowledge
        if: steps.review.outputs.adapter-request != '' && always()
        uses: platypeeps/sd-github-review@8636a3983d18de17c49907a4c48170a61b1bb713
        with:
          github-token: ${{ github.token }}
          operation: acknowledge
          adapter-request: ${{ steps.review.outputs.adapter-request }}
          adapter-outcome: ${{ steps.pr-agent.outcome }}

      - name: Finalize the external receipt
        if: steps.review.outputs.adapter-request != '' && always()
        uses: platypeeps/sd-github-review@8636a3983d18de17c49907a4c48170a61b1bb713
        with:
          github-token: ${{ github.token }}
          operation: finalize
          review-request: ${{ inputs.review-request }}
          adapter-acknowledgment: ${{ steps.acknowledge.outputs.adapter-acknowledgment }}
