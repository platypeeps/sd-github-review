name: SD GitHub review router
description: Route a pull request to a cost-efficient reviewer, a deep reviewer, Copilot, or no AI review.
author: platypeeps

inputs:
  github-token:
    description: "Token used to inspect the pull request, request Copilot, and manage durable receipts. Required at runtime for route, finalize, and query (which build a GitHub client); unused by acknowledge. Durable operations require checks: write."
    required: false
  operation:
    description: "Operation mode: standalone, route, acknowledge, finalize, or query."
    required: false
    default: standalone
  review-request:
    description: "Canonical v1 review-request JSON for route, finalize, or query."
    required: false
    default: ""
  adapter-acknowledgment:
    description: "Canonical v1 external-adapter acknowledgment JSON for finalize."
    required: false
    default: ""
  adapter-request:
    description: "Canonical v1 external-adapter request JSON for acknowledge."
    required: false
    default: ""
  adapter-outcome:
    description: "GitHub adapter step outcome for acknowledge: success, failure, cancelled, or skipped."
    required: false
    default: ""
  cheap-backend:
    description: "Canonical v1 external backend descriptor JSON used when durable routing selects cheap."
    required: false
    default: ""
  deep-backend:
    description: "Canonical v1 external backend descriptor JSON used when durable routing selects deep."
    required: false
    default: ""
  workflow-url:
    description: "Optional HTTPS workflow URL stored in the durable receipt; inferred from GitHub run metadata when omitted."
    required: false
    default: ""
  rerequest-authorized:
    description: "Whether repository policy authorizes the request's validated same-head rerequest."
    required: false
    default: "false"
  allow-bookkeeping-none:
    description: "Allow trusted bookkeeping-only successor evidence to lower automatic routing to none."
    required: false
    default: "false"
  bookkeeping-paths:
    description: "Comma- or newline-separated trusted bookkeeping globs used only for GitHub successor comparison."
    required: false
    default: |-
      .trellis/**
      .obsidian-kb/**
  fail-on-reconciliation:
    description: >-
      Fail the route step when the exact head already carries a durable receipt
      that needs reconciliation. Default true: such a receipt means no review
      was dispatched, and reporting that only on an output leaves a green job
      and a silently unreviewed pull request. The canonical durable workflow may
      contain no run: step, so this cannot be gated in the lane itself. Set
      false to report it on the outputs and in the job summary without failing.
      Applies to route only -- query exists to report durable state, and
      finalize would mask the reconciliation it was called to record.
    required: false
    default: "true"
  stranded-receipt-minutes:
    description: >-
      How long a receipt may sit at dispatch phase "started" before it is
      reported as stranded rather than in flight. A receipt is advanced out of
      "started" by the job that dispatched it, so the safe value is that job's
      maximum lifetime: past it, no job can still be running to finalize the
      receipt and the pull request can never be reviewed again at that head.
      The default 360 is GitHub's own job ceiling, which is what bounds a lane
      declaring no timeout-minutes, and it therefore cannot report a false
      strand. Lower it to match an explicit timeout-minutes to find stranded
      receipts sooner; set it below the real review latency and healthy
      in-flight reviews will be reported as stranded.
    required: false
    default: "360"
  independent-review-floor:
    description: "Minimum durable automatic route: none, cheap, deep, or copilot."
    required: false
    default: none
  route-policy:
    description: >-
      Maximum route a caller may explicitly request: auto, cheap, deep, copilot,
      or none. This is the repository's recorded REVIEW_ROUTE_MODE and is the
      opposite bound from independent-review-floor, which sets the minimum. An
      explicit request outside the policy is refused; auto is always permitted,
      so the floor and risk rules still choose the automatic route. Empty means
      no policy is recorded and every route is permitted.

      Wire this from the repository variable only -- an expression whose body is
      `vars.REVIEW_ROUTE_MODE` -- and never from a workflow_dispatch input. The
      body is spelled without its surrounding expression delimiters on purpose:
      GitHub evaluates expressions inside action.yml descriptions when it loads
      the action, `vars` is not a context an action definition may reference, and
      a delimited example here makes the action fail to load for every consumer.
      See the shipped lanes for the delimited form. The policy exists to
      bound what a dispatching caller may ask for, so letting that caller supply
      it hands them their own bound and silently disables enforcement. The
      neighbouring policy inputs on the shipped lane are deliberately wired the
      other way, which is what makes a consistency-minded edit here dangerous.
    required: false
    default: ""
  local-confidence-threshold:
    description: "Minimum 0-100 exact-head local confidence allowed to reduce an automatic route."
    required: false
    default: "80"
  local-evidence-route:
    description: "Strongest reduction target for eligible exact-head local evidence."
    required: false
    default: cheap
  mode:
    description: Routing mode. One of auto, cheap, deep, copilot, or none.
    required: false
    default: auto
  pr-number:
    description: Pull request number. Usually inferred from the event payload.
    required: false
  changed-line-threshold:
    description: In auto mode, additions plus deletions at or above this value select high-risk-route.
    required: false
    default: "800"
  high-risk-route:
    description: Route used for sensitive paths and changes at the line threshold. One of deep or copilot.
    required: false
    default: deep
  sensitive-paths:
    description: Comma- or newline-separated glob patterns that select high-risk-route in auto mode.
    required: false
    default: |-
      **/auth/**
      **/authentication/**
      **/authorization/**
      **/billing/**
      **/crypto/**
      **/migrations/**
      **/schema/**
      **/api/**
  confidence:
    description: Optional confidence from an earlier review stage. One of unknown, high, medium, or low.
    required: false
    default: unknown
  low-confidence-route:
    description: Route used when confidence is low. One of deep or copilot.
    required: false
    default: deep
  cheap-model:
    description: Provider model identifier emitted when the cheap route is selected.
    required: false
    default: ""
  deep-model:
    description: Provider model identifier emitted when the deep route is selected.
    required: false
    default: ""
  request-copilot:
    description: Whether to request the Copilot reviewer when the copilot route is selected.
    required: false
    default: "true"
  copilot-reviewer:
    description: GitHub login used for Copilot code review.
    required: false
    default: copilot-pull-request-reviewer[bot]
  review-drafts:
    description: Whether auto mode should review draft pull requests.
    required: false
    default: "false"
  trusted-associations:
    description: Comma-separated author associations allowed to issue /review commands.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  allow-pr-author-commands:
    description: Allow the pull request author to issue /review commands regardless of repository association.
    required: false
    default: "false"

outputs:
  operation:
    description: "Executed operation: standalone, route, acknowledge, finalize, or query."
  route:
    description: "Selected route: cheap, deep, copilot, or none."
  reason:
    description: Human-readable explanation of the routing decision.
  model:
    description: Configured model identifier for a cheap or deep external reviewer.
  pull-request-number:
    description: Pull request number that was evaluated.
  changed-lines:
    description: Additions plus deletions reported by GitHub.
  sensitive-files:
    description: JSON array of files matching sensitive-path patterns.
  run-external-reviewer:
    description: true when the caller should run PR-Agent or another external reviewer.
  copilot-requested:
    description: true when this invocation requested Copilot through the GitHub API.
  receipt:
    description: Canonical durable v1 receipt JSON, or empty when query found no receipt.
  receipt-verified:
    description: true when the receipt output was re-read from the durable Check Run after the latest mutation.
  receipt-id:
    description: Durable receipt identifier.
  logical-dispatch-id:
    description: Exact repository, pull request, head, and attempt dispatch identity.
  request-fingerprint:
    description: Canonical request intent fingerprint.
  durable-state:
    description: >-
      Durable operation result state: started, in-flight, acknowledged, observed,
      skipped, failed, existing, not-found, or reconciliation-required. in-flight
      means a dispatch could still be running; reconciliation-required means it
      needs a human, and route fails on it unless fail-on-reconciliation is
      false.
  dispatch-status:
    description: Durable receipt dispatch status.
  dispatch-phase:
    description: Last proven durable dispatch phase.
  dispatch-allowed:
    description: true only when this invocation is authorized to perform the first logical dispatch.
  reconciliation-required:
    description: true when an uncertain side effect forbids fallback dispatch.
  reconciliation-error:
    description: Bounded diagnostic explaining why reconciliation is required.
  backend:
    description: Canonical selected backend descriptor JSON.
  backend-id:
    description: Selected backend identifier.
  backend-kind:
    description: Selected backend kind, copilot or external.
  cost-tier:
    description: Selected backend configured cost tier.
  quality-tier:
    description: Selected backend configured quality tier.
  finding-channels:
    description: JSON array of declared GitHub-observable finding channels.
  limitations:
    description: JSON array of material backend limitations.
  workflow-url:
    description: Durable receipt workflow URL when available.
  latency-ms:
    description: Bounded observed dispatch latency in milliseconds when available.
  adapter-request:
    description: One canonical external adapter request JSON only when a new cheap or deep dispatch is authorized.
  adapter-acknowledgment:
    description: Canonical v1 acknowledgment produced by the acknowledge operation.
  sensitive-file-count:
    description: Count of sensitive files considered by durable automatic routing; durable consumers must use this count because sensitive-files is always an empty array in durable mode.

runs:
  using: node24
  main: src/index.js

branding:
  icon: shuffle
  color: purple
